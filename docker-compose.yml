services:
  # Il Database
  mongo:
    image: mongo:6.0
    container_name: challenge_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  # L'interfaccia Grafica Web (per il video)
  mongo-express:
    image: mongo-express
    container_name: challenge_express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
    depends_on:
      - mongo

volumes:
  mongo_data:
